                    Keranjang <span id="cart-count" style="
                        position: absolute;
                        top: -8px;
                        right: -10px;
                        background: #C2377A;
                        color: white;
                        border-radius: 50%;
                        padding: 2px 6px;

    <section class="keranjang">
        <div class="container">
            <h1>Keranjang Pilihan Anda</h1>
            
            <div id="cart-empty">
                <p>Keranjang Anda masih kosong.</p>
                <a href="produk.html" class="btn-primary">Lihat Produk</a>
            </div>
            
            <div id="cart-items">
                <!-- Cart items will be injected by JavaScript -->
            </div>
            
            <div id="cart-total">
                <!-- Total will be injected by JavaScript -->
            </div>
            
            <div class="cart-notes">
                <h3>Catatan Pesanan</h3>
                <textarea id="order-notes" placeholder="Tambahkan catatan khusus untuk pesanan Anda (alamat pengiriman, instruksi khusus, dll.)" rows="3"></textarea>
            </div>
            
            <div class="cart-actions">
                <button class="btn-secondary" onclick="window.history.back()">Kembelanja</button>
                <button class="btn-primary" onclick="sendWhatsAppSummary()">Kirim Ringkasan via WhatsApp</button>
            </div>
        </div>
    </section>
